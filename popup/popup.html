<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>AI Chat Exporter</title>
  <link rel="icon" href="../icons/icon-32.png">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <h1><img src="../icons/icon-32.png" alt="" width="20" height="20">AI Chat Exporter</h1>
    <span id="site" class="site">—</span>
  </header>

  <p id="status" class="status" data-i18n="statusChecking"></p>

  <div class="actions">
    <button id="btn-json" class="primary" disabled data-i18n="btnJson"></button>
    <div class="row">
      <button id="btn-md" disabled data-i18n="btnMd"></button>
      <button id="btn-html" disabled data-i18n="btnHtml"></button>
    </div>
    <button id="btn-copy" class="ghost" disabled data-i18n="btnCopyJson"></button>
  </div>

  <div id="bulk" class="bulk" hidden>
    <button id="btn-bulk" data-i18n="bulkExport"></button>
    <div class="hint" data-i18n="bulkHint"></div>
  </div>

  <div class="section-title" data-i18n="continueIn"></div>
  <div class="targets" id="targets"></div>

  <div class="options">
    <!-- Тумблер: настоящий checkbox (для клавиатуры и экранных дикторов) + нарисованная дорожка -->
    <label class="option" id="button-row">
      <span data-i18n="optPageButton"></span>
      <span class="switch">
        <input type="checkbox" id="opt-button" role="switch" checked>
        <span class="track" aria-hidden="true"></span>
      </span>
    </label>
    <!-- Сегментный переключатель языка: подсвеченная «таблетка» переезжает к выбранному варианту -->
    <div class="option" id="lang-row">
      <span id="lang-label" data-i18n="optLanguage"></span>
      <div class="segmented" id="opt-lang" role="radiogroup" aria-labelledby="lang-label">
        <span class="thumb" aria-hidden="true"></span>
        <button type="button" role="radio" data-value="auto" data-i18n="langAutoShort"></button>
        <button type="button" role="radio" data-value="en">English</button>
        <button type="button" role="radio" data-value="ru">Русский</button>
      </div>
    </div>
  </div>

  <footer>
    <div class="services">ChatGPT · Claude · Gemini · Google AI Mode</div>
    <div class="credits">
      <span data-i18n="madeBy"></span>
      <a href="https://github.com/Vuek0" target="_blank" rel="noopener noreferrer">Vuek0</a>
      ·
      <a href="https://github.com/Vuek0/ai-chat-exporter" target="_blank" rel="noopener noreferrer">GitHub</a>
      ·
      <a href="https://github.com/Vuek0/ai-chat-exporter/issues" target="_blank" rel="noopener noreferrer" data-i18n="reportIssue"></a>
      · <span id="version"></span>
    </div>
  </footer>
  <script src="../src/format.js"></script>
  <script src="popup.js"></script>
</body>
</html>
