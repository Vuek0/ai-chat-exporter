<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>AI Chat Exporter</title>
  <link rel="icon" href="../icons/icon-32.png">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <h1><img src="../icons/icon-32.png" alt="" width="20" height="20">AI Chat Exporter</h1>
    <span id="site" class="site">—</span>
  </header>

  <p id="status" class="status">Проверяю страницу…</p>

  <div class="actions">
    <button id="btn-json" class="primary" disabled>Скачать JSON</button>
    <button id="btn-md" disabled>Скачать Markdown</button>
    <button id="btn-copy" class="ghost" disabled>Скопировать JSON</button>
  </div>

  <div class="section-title">Продолжить в…</div>
  <div class="targets" id="targets"></div>

  <label class="option">
    <input type="checkbox" id="opt-button" checked>
    Кнопка экспорта на странице чата
  </label>

  <footer>ChatGPT · Claude · Gemini · Google AI Mode</footer>
  <script src="../src/format.js"></script>
  <script src="popup.js"></script>
</body>
</html>
