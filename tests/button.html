<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><title>ACE button test</title>
<style>body { font: 14px system-ui; margin: 24px; } @media (prefers-color-scheme: dark) { body { background: #111; color: #eee; } }</style>
</head>
<body>
<!-- Макет страницы ChatGPT для проверки плавающей кнопки экспорта -->
<div data-message-author-role="user"><div class="whitespace-pre-wrap">Привет! Как дела?</div></div>
<div data-message-author-role="assistant"><div class="markdown"><p>Отлично, <strong>спасибо</strong>!</p><ul><li>Пункт</li></ul></div></div>
<!-- Поле ввода внизу по центру, как в чат-сервисах -->
<form id="composer" style="position:fixed;left:50%;bottom:24px;transform:translateX(-50%);width:min(640px,80vw);display:flex;border:1px solid #888;border-radius:24px;padding:10px 16px;background:Canvas">
  <textarea placeholder="Спросите что-нибудь" rows="1" style="flex:1;border:0;outline:0;resize:none;background:transparent;color:inherit;font:inherit"></textarea>
</form>
<script>
  // Заглушки chrome.* для запуска вне расширения
  // Переводы берём из настоящих _locales; язык — ?lang=ru (по умолчанию en)
  const LANG = new URLSearchParams(location.search).get("lang") || "en";
  const loadMessages = (l) => {
    const x = new XMLHttpRequest();
    x.open("GET", `../_locales/${l}/messages.json`, false);
    x.send();
    return x.status === 200 ? JSON.parse(x.responseText) : {};
  };
  const MESSAGES = { ...loadMessages("en"), ...loadMessages(LANG) };
  window.chrome = {
    i18n: {
      getMessage: (k) => (k === "@@ui_locale" ? LANG : (MESSAGES[k] && MESSAGES[k].message) || ""),
      getUILanguage: () => LANG,
    },
    runtime: {
      onMessage: { addListener() {} },
      // Заглушка background: запоминаем, что попросили открыть
      sendMessage: async (msg) => {
        if (msg.type === "ACE_TRANSFER") { window.__lastTransfer = msg; return { ok: true }; }
        return null;
      },
    },
    storage: {
      local: { get: async (d) => d, set: async () => {} },
      onChanged: { addListener() {} },
    },
  };
</script>
<script src="../src/common.js"></script>
<script src="../src/format.js"></script>
<script src="../src/extractors/chatgpt.js"></script>
<script src="../src/content.js"></script>
<script>
  // На localhost экстрактор ChatGPT не совпадает по домену — включаем его для теста
  __ACE__.extractors[0].match = () => true;
</script>
<script src="../src/zip.js"></script>
<script src="../src/bulk.js"></script>
<script>
  // Поддельный массовый экспорт: 6 чатов, на 3-м — один ответ 429, 5-й — ошибка
  let hits429 = 0;
  __ACE__.extractors[0].bulk = {
    prepare: async () => "ctx",
    list: async () => Array.from({ length: 6 }, (_, i) => ({ id: "id" + i + "abcdefgh", title: "Чат №" + i, updated_at: 1763700000 + i * 86400 })),
    fetch: async (id) => {
      await __ACE__.sleep(50);
      if (id.startsWith("id2") && hits429++ === 0) throw __ACE__.httpError(429);
      if (id.startsWith("id4")) throw __ACE__.httpError(404);
      return { title: "Чат " + id.slice(0, 3), url: "https://chatgpt.com/c/" + id, method: "api",
        messages: [{ role: "user", content: "Вопрос " + id }, { role: "assistant", content: "**Ответ** для " + id }] };
    },
  };
</script>
<script src="../src/ui.js"></script>
<script src="../src/transfer.js"></script>
<script>
  // Адрес как у настоящего чата ChatGPT (/c/<id>), иначе экспорт ответит «откройте чат».
  // Меняем после загрузки скриптов, чтобы относительные пути ../src/ уже отработали.
  history.replaceState(null, "", "/c/test-0000-1111-2222" + location.search);
</script>
</body>
</html>
