<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><title>ACE converter test</title></head>
<body>
<!-- Макет разметки ChatGPT для проверки DOM-разбора и HTML->Markdown -->
<div id="mock">
  <div data-message-author-role="user"><div class="whitespace-pre-wrap">Привет!
Напиши функцию на Python</div></div>
  <div data-message-author-role="assistant"><div class="markdown">
    <h2>Решение</h2>
    <p>Вот <strong>функция</strong> с <code>def</code>, см. <a href="https://python.org">доки</a>:</p>
    <pre><div>python<button>Copy code</button></div><code class="language-python">def add(a, b):
    return a + b
</code></pre>
    <ul><li>Пункт один</li><li>Пункт два<ol><li>Вложенный</li></ol></li></ul>
    <blockquote><p>Цитата</p></blockquote>
    <table><tr><th>A</th><th>B</th></tr><tr><td>1</td><td>2 | 3</td></tr></table>
    <p>Формула <span class="katex"><annotation encoding="application/x-tex">x^2</annotation><span class="katex-html" aria-hidden="true">x2</span></span></p>
  </div></div>
</div>
<pre id="out"></pre>
<script>window.chrome = { runtime: { onMessage: { addListener(fn) { window.__listener = fn; } } } };</script>
